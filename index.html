/* =========================
   SEARCH / ANALYSIS
========================= */

function normalize(s){
return s.toLowerCase()
.replace(/samsung galaxy /g,"")
.replace(/xiaomi /g,"")
.replace(/mobile/g,"")
.replace(/\s+/g," ")
.trim();
}

function check(){

let input=document.getElementById("q").value.trim();

if(!input){
document.getElementById("result").innerHTML=
"<div class='result'>📱 আগে একটি phone model লিখুন।</div>";
return;
}

let q=normalize(input);


/* Confirmed result first */

for(let key in confirmed){

if(q===normalize(key) || q.includes(normalize(key)) || normalize(key).includes(q)){

if(confirmed[key]==="success"){
show("🟢","CONFIRMED SUCCESS",
"এই model TokenRun-এ বাস্তবে কাজ করেছে।",
"confirmed");
}else{
show("🔴","CONFIRMED FAILURE",
"এই model TokenRun test-এ কাজ করেনি।",
"fail");
}
return;
}
}


/* Known phone */

let found=null;

for(let key in phones){

if(q===normalize(key) || q.includes(normalize(key)) || normalize(key).includes(q)){
found=phones[key];
break;
}
}


if(found){

let chip=found[0];
let level=found[1];

if(level==="success"){
show("🟢","CONFIRMED SUCCESS",
chip+" — user-tested successful device.",
"confirmed");
return;
}

if(level==="fail"){
show("🔴","CONFIRMED FAILURE",
chip+" — user-tested failure device.",
"fail");
return;
}

if(level==="strong"){
show("🟢","LIKELY TO WORK",
chip+" — strong GNSS/hardware candidate. Actual TokenRun test is the final confirmation.",
"likely");
return;
}

if(level==="good"){
show("🟢","LIKELY TO WORK",
chip+" — good hardware/GNSS candidate. Actual TokenRun test is required for confirmation.",
"likely");
return;
}

if(level==="medium"){
show("🟡","UNCERTAIN / POSSIBLE",
chip+" — hardware may support the required positioning features, but evidence is not conclusive.",
"uncertain");
return;
}

if(level==="weak"){
show("🔴","LIKELY TO FAIL",
chip+" — weaker positioning/hardware profile. This is a prediction, not a confirmed TokenRun result.",
"fail");
return;
}
}


/* Chipset name directly typed */

for(let chip in chipRules){

if(q.includes(chip)){

let level=chipRules[chip];

if(level==="strong"||level==="good"){
show("🟢","LIKELY TO WORK",
"Detected chipset: "+chip+". GNSS/hardware profile is favorable.",
"likely");
return;
}

if(level==="medium"){
show("🟡","UNCERTAIN",
"Detected chipset: "+chip+". More real-world TokenRun data is needed.",
"uncertain");
return;
}

if(level==="weak"){
show("🔴","LIKELY TO FAIL",
"Detected chipset: "+chip+". Positioning capability appears less favorable.",
"fail");
return;
}
}


/* S23 special smart analysis */

"Galaxy S23 India model uses Snapdragon 8 Gen 2. Its GNSS hardware supports advanced multi-frequency positioning. This is a hardware-based prediction; an actual TokenRun test is the final confirmation.",
"likely");

/* Unknown */

show("🟡","NO VERIFIED MODEL DATA",

function show(icon,title,text,type){

document.getElementById("result").innerHTML=
"<div class='result'>"+
"<h2 class='"+type+"'>"+icon+" "+title+"</h2>"+
"<p>"+text+"</p>"+
"<p class='small'>⚠️ Prediction is not a guarantee. TokenRun's real-world test is the final confirmation.</p>"+

}
