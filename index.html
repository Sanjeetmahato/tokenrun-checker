<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TokenRun Mobile Checker</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f2f5f8;
  margin:0;
  padding:20px;
}
.box{
  max-width:650px;
  margin:auto;
  background:white;
  padding:22px;
  border-radius:18px;
  box-shadow:0 4px 18px #0002;
}
h1{
  margin-top:0;
}
input{
  width:100%;
  box-sizing:border-box;
  padding:15px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:17px;
}
button{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#1677ff;
  color:white;
  font-size:17px;
}
.result{
  margin-top:18px;
  padding:18px;
  border-radius:12px;
  background:#f5f6f7;
}
.green{color:#087f23}
.yellow{color:#9a6800}
.red{color:#c62828}
.info{
  color:#666;
  font-size:14px;
}
</style>
</head>

<body>

<div class="box">

<h1>📍 TokenRun Mobile Checker</h1>

<p>
Phone model লিখে Analyze করো।
Confirmed result থাকলে সেটা দেখাবে,
না থাকলে hardware/GNSS analysis করবে।
</p>

<input id="phone"
placeholder="যেমন: Samsung S23">

<button onclick="analyze()">Analyze Phone</button>

<div id="result"></div>

</div>

<script>

const confirmed = {

"vivo t3 pro":"success",
"poco m2 pro":"success",
"motorola edge 50 neo":"success",
"cmf phone 1":"success",
"vivo y400 pro":"success",
"poco c65":"success",
"vivo y35":"success",
"realme p1 5g":"success",

"poco m4 pro":"fail",
"realme 15t":"fail",
"infinix hot 11":"fail"

};


const phones = {

"samsung s23":{
chip:"Snapdragon 8 Gen 2",
level:"strong"
},

"samsung galaxy s23":{
chip:"Snapdragon 8 Gen 2",
level:"strong"
},

"redmi k20 pro":{
chip:"Snapdragon 855",
level:"strong"
},

"realme p3 pro":{
chip:"Snapdragon 7s Gen 3",
level:"strong"
},

"realme 10 pro":{
chip:"Snapdragon 695",
level:"good"
},

"vivo t3":{
chip:"Dimensity 7200",
level:"strong"
},

"vivo t3x 5g":{
chip:"Snapdragon 6 Gen 1",
level:"good"
},

"vivo t4x 5g":{
chip:"Dimensity 7300",
level:"strong"
},

"vivo v29":{
chip:"Snapdragon 778G",
level:"good"
},

"vivo v50":{
chip:"Snapdragon 7 Gen 3",
level:"strong"
},

"poco m6 5g":{
chip:"Dimensity 6100+",
level:"good"
},

"poco m6 plus 5g":{
chip:"Snapdragon 4 Gen 2",
level:"good"
},

"redmi 12 5g":{
chip:"Snapdragon 4 Gen 2",
level:"good"
},

"oneplus nord ce 2 5g":{
chip:"Dimensity 900",
level:"good"
},

"oppo k13":{
chip:"Snapdragon 6 Gen 4",
level:"good"
},

"iqoo 12":{
chip:"Snapdragon 8 Gen 3",
level:"strong"
},

"iqoo 13":{
chip:"Snapdragon 8 Elite",
level:"strong"
},

"nothing phone 2":{
chip:"Snapdragon 8+ Gen 1",
level:"strong"
},

"cmf phone 2 pro":{
chip:"Dimensity 7300 Pro",
level:"strong"
},

"motorola edge 50":{
chip:"Dimensity 7300",
level:"strong"
},

"motorola edge 60 fusion":{
chip:"Dimensity 7400",
level:"strong"
},

"infinix hot 10i":{
chip:"Helio G25",
level:"weak"
},

"infinix note 11s":{
chip:"Helio G96",
level:"medium"
}

};


function clean(text){

return text
.toLowerCase()
.trim()
.replace(/\s+/g," ");

}


function analyze(){

const input=document.getElementById("phone").value;

const q=clean(input);

const result=document.getElementById("result");


if(!q){

result.innerHTML=
"<div class='result'>📱 আগে একটি phone model লিখুন।</div>";

return;

}


/* Confirmed real-world result */

for(const name in confirmed){

if(q===name || q.includes(name) || name.includes(q)){

if(confirmed[name]==="success"){

result.innerHTML=`

<div class="result">

<h2 class="green">🟢 CONFIRMED SUCCESS</h2>

<p>
এই ফোনটি TokenRun-এ বাস্তবে কাজ করেছে।
</p>

<p class="info">
Actual user test অনুযায়ী confirmed result।
</p>

</div>`;

}else{

result.innerHTML=`

<div class="result">

<h2 class="red">🔴 CONFIRMED FAILURE</h2>

<p>
এই ফোনটি TokenRun test-এ কাজ করেনি।
</p>

<p class="info">
Actual user test অনুযায়ী confirmed result।
</p>

</div>`;

}

return;

}

}


/* Known phone analysis */

let found=null;

for(const name in phones){

if(q===name || q.includes(name) || name.includes(q)){

found=phones[name];

break;

}

}


if(found){

if(found.level==="strong"){

result.innerHTML=`

<div class="result">

<h2 class="green">
🟢 LIKELY TO WORK
</h2>

<p>
<b>Chipset:</b> ${found.chip}
</p>

<p>
Hardware/GNSS profile অনুযায়ী TokenRun কাজ করার সম্ভাবনা ভালো।
</p>

<p class="info">
⚠️ এটি prediction। Actual TokenRun test-ই final confirmation।
</p>

</div>`;

return;

}


if(found.level==="good"){

result.innerHTML=`

<div class="result">

<h2 class="green">
🟢 POSSIBLY WORKS
</h2>

<p>
<b>Chipset:</b> ${found.chip}
</p>

<p>
Hardware profile favorable, কিন্তু real-world TokenRun data প্রয়োজন।
</p>

</div>`;

return;

}


if(found.level==="medium"){

result.innerHTML=`

<div class="result">

<h2 class="yellow">
🟡 UNCERTAIN
</h2>

<p>
<b>Chipset:</b> ${found.chip}
</p>

<p>
Hardware থেকে নিশ্চিত verdict দেওয়া যাচ্ছে না।
</p>

</div>`;

return;

}


if(found.level==="weak"){

result.innerHTML=`

<div class="result">

<h2 class="red">
🔴 LIKELY TO FAIL
</h2>

<p>
<b>Chipset:</b> ${found.chip}
</p>

<p>
Positioning/GNSS profile দুর্বল হওয়ার কারণে failure-এর সম্ভাবনা আছে।
</p>

</div>`;

return;

}

}


/* Unknown phone */

result.innerHTML=`

<div class="result">

<h2 class="yellow">
🟡 NO VERIFIED DATA
</h2>

<p>
এই model এখনো local database-এ নেই।
</p>

<p class="info">
পরের version-এ আরও India-market phones এবং chipset rules যোগ করা যাবে।
</p>

</div>`;

}

</script>

</body>
</html>
